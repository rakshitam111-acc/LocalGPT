<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LocalGPT — Private AI Platform</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0d0e12;
      color: #e2e8f0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 99px; }
    ::-webkit-scrollbar-track { background: transparent; }

    #sidebar {
      width: 280px;
      background-color: #121318;
      border-right: 1px solid #1e2029;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 50;
    }

    #sidebarBackdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 45;
      display: none;
    }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      background-color: #0d0e12;
      overflow: hidden;
    }

    .topbar {
      height: 60px;
      border-bottom: 1px solid #1e2029;
      background-color: rgba(13, 14, 18, 0.85);
      backdrop-filter: blur(12px);
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 20;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid transparent;
      color: #94a3b8;
      cursor: pointer;
      padding: 8px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .btn-icon:hover { background: #1e2029; color: #fff; border-color: #2e3240; }

    .model-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 12px;
      background: #171922;
      border: 1px solid #282b38;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .model-pill:hover { background: #1f2230; border-color: #6366f1; }

    #chatMessages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 18px 150px 18px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    .msg-row { display: flex; gap: 14px; width: 100%; animation: fadeIn 0.2s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.assistant { justify-content: flex-start; }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
      background-size: cover;
      background-position: center;
    }
    .avatar.bot { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
    .avatar.user { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; border-radius: 50%; }

    .msg-bubble {
      max-width: 88%;
      font-size: 14.5px;
      line-height: 1.68;
    }
    .msg-row.user .msg-bubble {
      background: #1e2029;
      border: 1px solid #2e3240;
      color: #f8fafc;
      padding: 12px 18px;
      border-radius: 20px;
      border-bottom-right-radius: 4px;
    }
    .msg-row.assistant .msg-bubble {
      background: transparent;
      color: #f1f5f9;
      flex: 1;
    }

    .msg-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding-top: 6px;
    }
    .action-btn {
      background: #171922;
      border: 1px solid #282b38;
      color: #94a3b8;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .action-btn:hover { background: #232736; color: #fff; border-color: #6366f1; }

    .prose p { margin-bottom: 12px; }
    .prose ul, .prose ol { margin-left: 22px; margin-bottom: 12px; }
    .prose li { margin-bottom: 6px; }
    .prose strong { color: #fff; font-weight: 700; }
    .prose code { background: #1e2029; border: 1px solid #2e3240; padding: 2px 7px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.88em; color: #a5b4fc; }
    .prose pre { background: #13141a; border: 1px solid #252836; border-radius: 12px; padding: 14px; margin: 14px 0; overflow-x: auto; }
    .prose pre code { background: transparent; border: none; padding: 0; font-size: 0.86em; color: #e2e8f0; }

    .bottom-input-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 18px 20px 18px;
      background: linear-gradient(180deg, rgba(13,14,18,0) 0%, #0d0e12 40%);
      z-index: 30;
    }
    .input-box {
      max-width: 820px;
      margin: 0 auto;
      background: #171922;
      border: 1px solid #282b38;
      border-radius: 20px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 36px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
    }
    .input-box:focus-within { border-color: #6366f1; box-shadow: 0 12px 40px rgba(99,102,241,0.18); }

    textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 14.5px;
      font-family: inherit;
      padding: 6px 4px;
      resize: none;
      outline: none;
      max-height: 180px;
      line-height: 1.5;
    }
    textarea::placeholder { color: #64748b; }

    .input-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 6px;
    }
    .btn-send {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .btn-send:hover { transform: scale(1.05); }

    .starter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
      margin-top: 24px;
    }
    .starter-card {
      background: #14161f;
      border: 1px solid #232736;
      padding: 16px;
      border-radius: 14px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }
    .starter-card:hover { background: #1c1f2c; border-color: #6366f1; transform: translateY(-2px); }
    .starter-card h4 { font-size: 13.5px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .starter-card p { font-size: 12px; color: #94a3b8; }

    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 8px;
      background: #171922;
      border: 1px solid #282b38;
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      width: 320px;
      z-index: 60;
    }
    .dropdown-menu.hidden { display: none; }
    .dropdown-item {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      padding: 10px 12px;
      border-radius: 10px;
      color: #f1f5f9;
      font-size: 12.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
      margin-bottom: 4px;
    }
    .dropdown-item:hover { background: #232736; border-color: #3b4259; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-overlay.hidden { display: none; }
    .modal-content {
      background: #14161f;
      border: 1px solid #282b38;
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      color: #fff;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: #cbd5e1; margin-bottom: 6px; }
    .form-input {
      width: 100%;
      background: #1c1f2c;
      border: 1px solid #2f3447;
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .form-input:focus { border-color: #6366f1; }

    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
      }
      #sidebar.open { transform: translateX(0); }
      .starter-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div id="sidebarBackdrop" onclick="toggleSidebar()"></div>

  <!-- ================= SIDEBAR ================= -->
  <aside id="sidebar">
    <div style="padding: 16px; border-bottom: 1px solid #1e2029;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; color: #fff;">
            <i data-lucide="sparkles" style="width: 18px; height: 18px;"></i>
          </div>
          <span style="font-weight: 800; font-size: 17px; letter-spacing: -0.5px; color: #fff;">LocalGPT</span>
        </div>
        <button onclick="openAuthModal()" id="authBadgeBtn" style="font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); cursor: pointer;">
          Sign In
        </button>
      </div>

      <button onclick="createNewChat()" style="width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; border-radius: 12px; background: #171922; border: 1px solid #282b38; color: #fff; font-size: 13.5px; font-weight: 600; cursor: pointer;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <i data-lucide="plus" style="width: 16px; height: 16px; color: #818cf8;"></i>
          <span>New Chat</span>
        </div>
        <span style="font-size: 10px; color: #64748b; background: #232736; padding: 2px 6px; border-radius: 6px;">⌘K</span>
      </button>
    </div>

    <!-- Conversation List -->
    <div id="conversationList" style="flex: 1; overflow-y: auto; padding: 10px 8px;">
      <div style="padding: 20px; text-align: center; font-size: 12px; color: #64748b;">No chats yet. Start a new one!</div>
    </div>

    <!-- Knowledge Base RAG -->
    <div style="padding: 14px; border-top: 1px solid #1e2029; background: #0f1015;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
        <div style="display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">
          <i data-lucide="database" style="width: 14px; height: 14px; color: #818cf8;"></i>
          <span>My Knowledge Base</span>
        </div>
        <span id="docCountBadge" style="font-size: 10px; font-weight: 600; color: #a5b4fc; background: #1c1f2c; padding: 2px 8px; border-radius: 99px;">0 files</span>
      </div>

      <label style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 10px; border: 1px dashed #2f3447; border-radius: 10px; font-size: 12px; font-weight: 600; color: #cbd5e1; cursor: pointer; background: #14161f;">
        <i data-lucide="upload-cloud" style="width: 16px; height: 16px; color: #818cf8;"></i>
        <span>Upload PDF, Word, CSV, TXT</span>
        <input type="file" id="fileUploadInput" multiple accept=".pdf,.docx,.txt,.csv,.json,.md" style="display: none;" onchange="handleFileUpload(event)">
      </label>
      <div id="uploadedDocsList" style="margin-top: 8px; max-height: 90px; overflow-y: auto; font-size: 11.5px; color: #94a3b8;"></div>
    </div>

    <!-- User Profile & Account Menu -->
    <div style="padding: 14px; border-top: 1px solid #1e2029; display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 10px; overflow: hidden; cursor: pointer;" onclick="openAuthModal()">
        <div class="avatar user" id="userAvatar">U</div>
        <div style="overflow: hidden;">
          <div style="font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; text-overflow: ellipsis;" id="userName">User</div>
          <div style="font-size: 11px; color: #94a3b8; white-space: nowrap; text-overflow: ellipsis;" id="userEmail">Loading...</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 4px;">
        <button onclick="openSettingsModal()" class="btn-icon" title="Settings">
          <i data-lucide="settings" style="width: 16px; height: 16px;"></i>
        </button>
        <button onclick="handleLogout()" class="btn-icon" title="Sign Out" id="logoutBtn" style="color: #ef4444;">
          <i data-lucide="log-out" style="width: 16px; height: 16px;"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- ================= MAIN CHAT AREA ================= -->
  <main id="main">
    <header class="topbar">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button onclick="toggleSidebar()" class="btn-icon">
          <i data-lucide="panel-left" style="width: 20px; height: 20px;"></i>
        </button>

        <div style="position: relative;">
          <button onclick="toggleModelDropdown()" id="modelSelectorBtn" class="model-pill">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: #34d399; display: inline-block;"></span>
            <span id="selectedModelLabel">Llama 3.2 (Local Ollama — Fast)</span>
            <i data-lucide="chevron-down" style="width: 14px; height: 14px; color: #94a3b8;"></i>
          </button>

          <div id="modelDropdown" class="dropdown-menu hidden">
            <div id="dynamicModelOptions"></div>
          </div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <label style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: #cbd5e1; background: #171922; padding: 6px 12px; border-radius: 10px; border: 1px solid #282b38; cursor: pointer;">
          <input type="checkbox" id="useRagToggle" checked style="accent-color: #6366f1;">
          <span>RAG Active</span>
        </label>
        <button onclick="openSettingsModal()" class="btn-icon" style="font-size: 12px; gap: 6px; padding: 7px 12px; background: #171922; border: 1px solid #282b38; border-radius: 10px;">
          <i data-lucide="sliders" style="width: 14px; height: 14px;"></i>
          <span>Parameters</span>
        </button>
      </div>
    </header>

    <div id="chatMessages"></div>

    <div class="bottom-input-container">
      <div class="input-box">
        <textarea
          id="promptInput"
          rows="1"
          placeholder="Message your AI model or ask questions about your documents..."
          onkeydown="handleInputKeyDown(event)"
          oninput="autoResizeTextarea(this)"
        ></textarea>

        <div class="input-actions">
          <div style="display: flex; align-items: center; gap: 8px;">
            <button onclick="document.getElementById('fileUploadInput').click()" class="btn-icon" title="Attach Document">
              <i data-lucide="paperclip" style="width: 18px; height: 18px;"></i>
            </button>
            <span style="font-size: 11px; color: #34d399; font-weight: 600; display: flex; align-items: center; gap: 4px;">
              <i data-lucide="shield-check" style="width: 13px; height: 13px;"></i>
              <span id="privateSessionTag">Private Workspace</span>
            </span>
          </div>

          <div style="display: flex; align-items: center; gap: 8px;">
            <button id="stopBtn" onclick="stopGenerating()" style="display: none; padding: 7px 14px; border-radius: 8px; background: #ef4444; color: #fff; border: none; font-size: 12px; font-weight: 700; cursor: pointer;">
              Stop
            </button>
            <button id="sendBtn" onclick="sendMessage()" class="btn-send">
              <i data-lucide="arrow-up" style="width: 18px; height: 18px;"></i>
            </button>
          </div>
        </div>
      </div>
      <div style="text-align: center; margin-top: 8px; font-size: 11.5px; color: #64748b;">
        LocalGPT &bull; Private Multi-User AI Platform
      </div>
    </div>
  </main>

  <!-- ================= AUTH MODAL ================= -->
  <div id="authModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #282b38; padding-bottom: 12px; margin-bottom: 16px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 32px; height: 32px; border-radius: 10px; background: #6366f1; display: flex; align-items: center; justify-content: center;">
            <i data-lucide="user" style="width: 16px; height: 16px; color: #fff;"></i>
          </div>
          <span style="font-size: 16px; font-weight: 800; color: #fff;" id="authModalTitle">Sign In / Create Account</span>
        </div>
        <button onclick="closeAuthModal()" class="btn-icon"><i data-lucide="x" style="width: 18px; height: 18px;"></i></button>
      </div>

      <!-- Google / Instant Sign In Form -->
      <div style="background: #1c1f2c; border: 1px solid #2f3447; border-radius: 14px; padding: 16px; margin-bottom: 16px;">
        <div style="font-size: 12px; font-weight: 700; color: #fff; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;">
          <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Quick Google Sign In</span>
        </div>
        <input type="email" id="googleEmailInput" class="form-input" placeholder="Enter your Google email..." style="margin-bottom: 10px;">
        <button onclick="submitGoogleLogin()" style="width: 100%; padding: 10px; border-radius: 10px; background: #fff; color: #1a1a1a; border: none; font-size: 13px; font-weight: 700; cursor: pointer;">
          Sign In with Google
        </button>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; margin: 16px 0; color: #64748b; font-size: 11px; font-weight: 700; text-transform: uppercase;">
        <div style="flex: 1; height: 1px; background: #282b38;"></div>
        <span>Or Password Login</span>
        <div style="flex: 1; height: 1px; background: #282b38;"></div>
      </div>

      <!-- Password Login Form -->
      <form onsubmit="handleEmailAuth(event)">
        <div class="form-group" id="fullNameGroup" style="display: none;">
          <label>Your Name</label>
          <input type="text" id="authNameInput" class="form-input" placeholder="Name">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="authEmailInput" class="form-input" required placeholder="name@domain.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="authPasswordInput" class="form-input" required placeholder="••••••••">
        </div>

        <div id="authErrorMsg" style="color: #ef4444; font-size: 12px; margin-bottom: 12px; display: none;"></div>

        <button type="submit" id="authSubmitBtn" style="width: 100%; padding: 11px; border-radius: 12px; background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; border: none; font-size: 13.5px; font-weight: 700; cursor: pointer;">
          Sign In with Password
        </button>
      </form>

      <div style="text-align: center; margin-top: 14px; font-size: 12px; color: #94a3b8;">
        <span id="authTogglePrompt">Don't have an account?</span>
        <button onclick="toggleAuthMode()" id="authToggleBtn" style="background: none; border: none; color: #818cf8; font-weight: 700; cursor: pointer; margin-left: 4px;">
          Create One
        </button>
      </div>
    </div>
  </div>

  <!-- ================= SETTINGS MODAL ================= -->
  <div id="settingsModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #282b38; padding-bottom: 12px; margin-bottom: 16px;">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700;">
          <i data-lucide="sliders" style="width: 20px; height: 20px; color: #818cf8;"></i>
          <span>Inference Settings</span>
        </div>
        <button onclick="closeSettingsModal()" class="btn-icon"><i data-lucide="x" style="width: 18px; height: 18px;"></i></button>
      </div>

      <div class="form-group">
        <label>System Prompt Instructions</label>
        <textarea id="systemPromptInput" class="form-input" rows="3" placeholder="You are a helpful, accurate, and concise AI assistant."></textarea>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="form-group">
          <label>Temperature (<span id="tempVal">0.7</span>)</label>
          <input type="range" id="tempSlider" min="0" max="1.5" step="0.05" value="0.7" oninput="document.getElementById('tempVal').innerText=this.value" style="width: 100%; accent-color: #6366f1;">
        </div>
        <div class="form-group">
          <label>Top-P (<span id="topPVal">0.9</span>)</label>
          <input type="range" id="topPSlider" min="0.1" max="1" step="0.05" value="0.9" oninput="document.getElementById('topPVal').innerText=this.value" style="width: 100%; accent-color: #6366f1;">
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #282b38; padding-top: 16px; margin-top: 16px;">
        <button onclick="closeSettingsModal()" style="padding: 9px 16px; border-radius: 10px; background: #1c1f2c; color: #cbd5e1; border: 1px solid #2f3447; font-size: 13px; font-weight: 600; cursor: pointer;">Cancel</button>
        <button onclick="saveSettings()" style="padding: 9px 20px; border-radius: 10px; background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; border: none; font-size: 13px; font-weight: 700; cursor: pointer;">Save Settings</button>
      </div>
    </div>
  </div>

  <!-- ================= JAVASCRIPT APPLICATION LOGIC ================= -->
  <script>
    let activeConversationId = null;
    let conversations = [];
    let currentModel = 'llama3.2:latest';
    let currentProvider = 'ollama';
    let isStreaming = false;
    let abortController = null;
    let lastUserPrompt = '';
    let isRegisterMode = false;
    let currentUser = null;

    function getApiBase() {
      const stored = localStorage.getItem('localgpt_backend_url');
      if (stored && stored.trim() && stored.startsWith('http')) return stored.trim().replace(/\/$/, '');
      return '';
    }

    function getAuthHeaders() {
      const token = localStorage.getItem('localgpt_token');
      return token ? { 'Authorization': `Bearer ${token}` } : {};
    }

    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      await initializeUserSession();
      await loadAvailableModels();
      await loadConversations();
      await loadDocuments();
      if (!activeConversationId && conversations.length > 0) {
        selectConversation(conversations[0].id);
      } else if (!activeConversationId) {
        await createNewChat();
      }
    });

    async function initializeUserSession() {
      // 1. Restore cached user immediately so page never flickers or logs out on refresh
      const cachedUser = localStorage.getItem('localgpt_user');
      if (cachedUser) {
        try {
          currentUser = JSON.parse(cachedUser);
          renderUserProfile();
        } catch (e) {}
      }

      const token = localStorage.getItem('localgpt_token');
      if (token) {
        try {
          const res = await fetch(`${getApiBase()}/api/auth/me`, { headers: getAuthHeaders() });
          if (res.ok) {
            currentUser = await res.json();
            localStorage.setItem('localgpt_user', JSON.stringify(currentUser));
            renderUserProfile();
            return;
          } else if (res.status === 401) {
            localStorage.removeItem('localgpt_token');
            localStorage.removeItem('localgpt_user');
            currentUser = null;
          }
        } catch (e) {
          if (currentUser) return;
        }
      }

      // 2. If no user session, create anonymous device session
      if (!currentUser || currentUser.is_guest) {
        let deviceId = localStorage.getItem('localgpt_device_id');
        if (!deviceId) {
          deviceId = 'dev_' + Math.random().toString(36).substring(2, 10);
          localStorage.setItem('localgpt_device_id', deviceId);
        }

        try {
          const res = await fetch(`${getApiBase()}/api/auth/anonymous`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ device_id: deviceId })
          });
          if (res.ok) {
            const data = await res.json();
            localStorage.setItem('localgpt_token', data.access_token);
            currentUser = data.user;
            localStorage.setItem('localgpt_user', JSON.stringify(currentUser));
            renderUserProfile();
          }
        } catch (e) {}
      }
    }

    function renderUserProfile() {
      if (!currentUser) return;
      document.getElementById('userName').innerText = currentUser.full_name || 'User';
      document.getElementById('userEmail').innerText = currentUser.is_guest ? 'Device Guest Workspace' : currentUser.email;
      
      const avatarEl = document.getElementById('userAvatar');
      if (currentUser.avatar_url && currentUser.avatar_url.startsWith('http')) {
        avatarEl.style.backgroundImage = `url('${currentUser.avatar_url}')`;
        avatarEl.innerText = '';
      } else {
        avatarEl.style.backgroundImage = 'none';
        avatarEl.innerText = (currentUser.full_name || currentUser.email || 'U')[0].toUpperCase();
      }

      const authBtn = document.getElementById('authBadgeBtn');
      if (currentUser.is_guest) {
        authBtn.innerText = 'Sign In';
        authBtn.style.display = 'block';
        document.getElementById('logoutBtn').style.display = 'none';
      } else {
        authBtn.innerText = 'Account';
        authBtn.style.display = 'none';
        document.getElementById('logoutBtn').style.display = 'inline-flex';
      }
    }

    async function submitGoogleLogin() {
      const email = document.getElementById('googleEmailInput').value.trim();
      if (!email || !email.includes('@')) {
        alert('Please enter a valid Google email address.');
        return;
      }
      const name = email.split('@')[0];

      try {
        const res = await fetch(`${getApiBase()}/api/auth/google`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, name: name })
        });
        const data = await res.json();
        if (res.ok && data.access_token) {
          localStorage.setItem('localgpt_token', data.access_token);
          currentUser = data.user;
          localStorage.setItem('localgpt_user', JSON.stringify(currentUser));
          renderUserProfile();
          closeAuthModal();
          await loadConversations();
          await loadDocuments();
          if (conversations.length > 0) selectConversation(conversations[0].id);
          else await createNewChat();
        } else {
          alert(data.detail || 'Login failed.');
        }
      } catch (err) {
        alert('Connection error. Please try again.');
      }
    }

    async function handleEmailAuth(e) {
      e.preventDefault();
      const email = document.getElementById('authEmailInput').value.trim();
      const password = document.getElementById('authPasswordInput').value;
      const name = document.getElementById('authNameInput').value.trim();
      const errDiv = document.getElementById('authErrorMsg');
      errDiv.style.display = 'none';

      const endpoint = isRegisterMode ? '/api/auth/register' : '/api/auth/login';
      const payload = isRegisterMode ? { email, password, full_name: name } : { email, password };

      try {
        const res = await fetch(`${getApiBase()}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok && data.access_token) {
          localStorage.setItem('localgpt_token', data.access_token);
          currentUser = data.user;
          localStorage.setItem('localgpt_user', JSON.stringify(currentUser));
          renderUserProfile();
          closeAuthModal();
          await loadConversations();
          await loadDocuments();
          if (conversations.length > 0) selectConversation(conversations[0].id);
          else await createNewChat();
        } else {
          errDiv.innerText = data.detail || 'Authentication failed.';
          errDiv.style.display = 'block';
        }
      } catch (err) {
        errDiv.innerText = 'Connection error. Please try again.';
        errDiv.style.display = 'block';
      }
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('authModalTitle').innerText = isRegisterMode ? 'Create Your Account' : 'Sign In to Your Account';
      document.getElementById('fullNameGroup').style.display = isRegisterMode ? 'block' : 'none';
      document.getElementById('authSubmitBtn').innerText = isRegisterMode ? 'Create Account' : 'Sign In with Password';
      document.getElementById('authTogglePrompt').innerText = isRegisterMode ? 'Already have an account?' : "Don't have an account?";
      document.getElementById('authToggleBtn').innerText = isRegisterMode ? 'Sign In' : 'Create One';
    }

    function handleLogout() {
      if (confirm('Are you sure you want to sign out?')) {
        localStorage.removeItem('localgpt_token');
        localStorage.removeItem('localgpt_user');
        location.reload();
      }
    }

    function openAuthModal() { document.getElementById('authModal').classList.remove('hidden'); }
    function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }

    async function loadAvailableModels() {
      try {
        const res = await fetch(`${getApiBase()}/api/models`, { headers: getAuthHeaders() });
        if (res.ok) {
          const data = await res.json();
          const models = data.models || [];
          const container = document.getElementById('dynamicModelOptions');
          
          if (models.length > 0) {
            currentModel = models[0].id;
            currentProvider = models[0].provider;
            document.getElementById('selectedModelLabel').innerText = models[0].name;

            container.innerHTML = `
              <div style="padding: 6px 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; color: #64748b; letter-spacing: 0.5px;">Choose AI Model</div>
              ${models.map(m => `
                <button onclick="selectModel('${m.id}', '${m.provider}', '${m.name}')" class="dropdown-item">
                  <div>
                    <div style="font-weight: 700; color: #fff;">${m.name}</div>
                    <div style="font-size: 11px; color: #a5b4fc;">${m.category || m.provider}</div>
                  </div>
                  <span style="font-size: 10px; padding: 2px 6px; border-radius: 6px; background: #282b38; color: #34d399; font-weight: 600;">${m.speed || 'Ready'}</span>
                </button>
              `).join('')}
            `;
          }
        }
      } catch (e) { console.log('Models fetch:', e); }
    }

    async function loadConversations() {
      try {
        const res = await fetch(`${getApiBase()}/api/conversations`, { headers: getAuthHeaders() });
        if (res.ok) {
          conversations = await res.json();
          renderConversationsList();
        }
      } catch (e) { console.error('Failed to load conversations', e); }
    }

    function renderConversationsList() {
      const container = document.getElementById('conversationList');
      if (conversations.length === 0) {
        container.innerHTML = '<div style="padding: 20px; text-align: center; font-size: 12px; color: #64748b;">No chats yet. Start a new one!</div>';
        return;
      }

      container.innerHTML = conversations.map(c => `
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 10px; cursor: pointer; margin-bottom: 3px; transition: all 0.15s ease; ${c.id === activeConversationId ? 'background: #1c1f2c; color: #fff; font-weight: 700; border: 1px solid #2f3447;' : 'color: #94a3b8;'}" onclick="selectConversation('${c.id}')">
          <div style="display: flex; align-items: center; gap: 8px; overflow: hidden;">
            <i data-lucide="message-square" style="width: 15px; height: 15px; flex-shrink: 0; color: ${c.id === activeConversationId ? '#818cf8' : '#64748b'};"></i>
            <span style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(c.title)}</span>
          </div>
          <button onclick="event.stopPropagation(); deleteChat('${c.id}')" class="btn-icon" style="padding: 2px;" title="Delete"><i data-lucide="trash-2" style="width: 13px; height: 13px;"></i></button>
        </div>
      `).join('');
      lucide.createIcons();
    }

    async function createNewChat() {
      try {
        const res = await fetch(`${getApiBase()}/api/conversations`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
          body: JSON.stringify({ title: 'New Chat', model: currentModel, provider: currentProvider })
        });
        if (res.ok) {
          const newConv = await res.json();
          conversations.unshift(newConv);
          selectConversation(newConv.id);
        }
      } catch (e) { console.error('Create chat failed', e); }
    }

    async function selectConversation(convId) {
      activeConversationId = convId;
      renderConversationsList();
      await fetchMessages(convId);
      if (window.innerWidth < 768) toggleSidebar(false);
    }

    async function fetchMessages(convId) {
      const container = document.getElementById('chatMessages');
      container.innerHTML = '<div style="display: flex; justify-content: center; padding: 40px;"><div style="width: 28px; height: 28px; border: 3px solid #6366f1; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite;"></div></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style>';
      try {
        const res = await fetch(`${getApiBase()}/api/conversations/${convId}`, { headers: getAuthHeaders() });
        if (res.ok) {
          const data = await res.json();
          if (!data.messages || data.messages.length === 0) {
            renderEmptyState();
          } else {
            renderMessages(data.messages);
          }
        }
      } catch (e) { console.error('Fetch messages failed', e); }
    }

    function renderEmptyState() {
      const container = document.getElementById('chatMessages');
      container.innerHTML = `
        <div style="text-align: center; max-width: 640px; margin: 40px auto 0 auto; animation: fadeIn 0.3s ease;">
          <div style="width: 54px; height: 54px; border-radius: 16px; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; color: #fff; margin: 0 auto 16px auto; box-shadow: 0 12px 30px rgba(99,102,241,0.4);">
            <i data-lucide="sparkles" style="width: 26px; height: 26px;"></i>
          </div>
          <h2 style="font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 8px; letter-spacing: -0.7px;">Where knowledge begins</h2>
          <p style="font-size: 14px; color: #94a3b8; margin-bottom: 24px;">Your private, isolated ChatGPT-style AI workspace.</p>

          <div class="starter-grid">
            <div class="starter-card" onclick="setPromptAndSend('Explain Quantum Computing: Qubits and Superposition in simple terms.')">
              <h4>🔬 Quantum Computing</h4>
              <p>Qubits, entanglement & algorithms explained</p>
            </div>
            <div class="starter-card" onclick="setPromptAndSend('What is Retrieval-Augmented Generation (RAG) and how does it prevent hallucinations?')">
              <h4>📄 Retrieval-Augmented Generation</h4>
              <p>How vector document search works</p>
            </div>
            <div class="starter-card" onclick="setPromptAndSend('Write a complete Python script to calculate cosine similarity.')">
              <h4>⚡ Python Code Generator</h4>
              <p>Generate clean, optimized Python algorithms</p>
            </div>
            <div class="starter-card" onclick="setPromptAndSend('Summarize the key advantages of running LLMs self-hosted locally.')">
              <h4>🛡️ Privacy & Performance</h4>
              <p>Zero API costs, total data ownership</p>
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function renderMessages(messages) {
      const container = document.getElementById('chatMessages');
      container.innerHTML = messages.map(msg => renderMessageHTML(msg)).join('');
      lucide.createIcons();
      document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
      scrollToBottom();
    }

    function renderMessageHTML(msg) {
      const isUser = msg.role === 'user';
      const parsedHTML = marked.parse(msg.content);
      const sourcesHTML = (msg.sources && msg.sources.length > 0) ? `
        <div style="margin-top: 14px; padding: 12px; background: #13141a; border: 1px solid #232736; border-radius: 12px; font-size: 12px;">
          <div style="font-weight: 700; color: #a5b4fc; margin-bottom: 6px; display: flex; align-items: center; gap: 6px;">
            <i data-lucide="book-open" style="width: 14px; height: 14px;"></i>
            <span>${msg.sources.length} Verified Source Reference(s):</span>
          </div>
          ${msg.sources.map((s, idx) => `
            <div style="padding: 8px 10px; background: #181a24; border: 1px solid #282b38; border-radius: 8px; margin-bottom: 4px; color: #cbd5e1;">
              <span style="color: #818cf8; font-weight: 700;">[${idx+1}]</span> <b>${s.source}</b> (Page ${s.page}) &bull; Sim: ${s.similarity}<br>
              <i style="color: #94a3b8; font-size: 11.5px;">"${escapeHtml(s.snippet || '')}"</i>
            </div>
          `).join('')}
        </div>
      ` : '';

      return `
        <div class="msg-row ${isUser ? 'user' : 'assistant'}">
          ${!isUser ? `<div class="avatar bot"><i data-lucide="sparkles" style="width: 18px; height: 18px;"></i></div>` : ''}
          <div class="msg-bubble">
            <div class="prose">${parsedHTML}</div>
            ${sourcesHTML}

            ${!isUser ? `
              <div class="msg-actions">
                <button onclick="copyToClipboard(this, '${escapeJs(msg.content)}')" class="action-btn" title="Copy"><i data-lucide="copy" style="width: 13px; height: 13px;"></i><span>Copy</span></button>
                <button onclick="speakText('${escapeJs(msg.content)}')" class="action-btn" title="Read Aloud"><i data-lucide="volume-2" style="width: 13px; height: 13px;"></i><span>Listen</span></button>
                <button onclick="regenerateLastResponse()" class="action-btn" title="Regenerate"><i data-lucide="refresh-cw" style="width: 13px; height: 13px;"></i><span>Retry</span></button>
              </div>
            ` : ''}
          </div>
          ${isUser ? `<div class="avatar user">U</div>` : ''}
        </div>
      `;
    }

    async function sendMessage() {
      const input = document.getElementById('promptInput');
      const text = input.value.trim();
      if (!text || isStreaming) return;

      lastUserPrompt = text;
      input.value = '';
      autoResizeTextarea(input);

      if (!activeConversationId) await createNewChat();

      const container = document.getElementById('chatMessages');
      container.insertAdjacentHTML('beforeend', renderMessageHTML({ role: 'user', content: text }));
      
      const assistantMsgId = 'msg-' + Date.now();
      container.insertAdjacentHTML('beforeend', `
        <div id="${assistantMsgId}" class="msg-row assistant">
          <div class="avatar bot"><i data-lucide="sparkles" style="width: 18px; height: 18px;"></i></div>
          <div class="msg-bubble">
            <div id="${assistantMsgId}-content" class="prose">
              <span style="color: #818cf8; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;">
                <span style="width: 6px; height: 6px; border-radius: 50%; background: #818cf8; display: inline-block; animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite;"></span>
                Thinking with ${currentModel}...
              </span>
            </div>
            <div id="${assistantMsgId}-sources"></div>
          </div>
        </div>
      `);
      lucide.createIcons();
      scrollToBottom();

      isStreaming = true;
      document.getElementById('stopBtn').style.display = 'inline-block';
      document.getElementById('sendBtn').style.display = 'none';

      abortController = new AbortController();

      try {
        const useRag = document.getElementById('useRagToggle').checked;
        const response = await fetch(`${getApiBase()}/api/chat/stream`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
          body: JSON.stringify({
            conversation_id: activeConversationId,
            message: text,
            provider: currentProvider,
            model: currentModel,
            use_rag: useRag,
          }),
          signal: abortController.signal,
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let accumulatedText = '';
        const contentDiv = document.getElementById(`${assistantMsgId}-content`);

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          const rawChunk = decoder.decode(value, { stream: true });
          const lines = rawChunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const eventData = JSON.parse(line.substring(6));
                if (eventData.type === 'chunk') {
                  accumulatedText += eventData.content;
                  contentDiv.innerHTML = marked.parse(accumulatedText);
                  scrollToBottom();
                } else if (eventData.type === 'sources') {
                  const sourcesDiv = document.getElementById(`${assistantMsgId}-sources`);
                  sourcesDiv.innerHTML = `
                    <div style="margin-top: 14px; padding: 12px; background: #13141a; border: 1px solid #232736; border-radius: 12px; font-size: 12px;">
                      <div style="font-weight: 700; color: #a5b4fc; margin-bottom: 6px; display: flex; align-items: center; gap: 6px;">
                        <i data-lucide="book-open" style="width: 14px; height: 14px;"></i>
                        <span>${eventData.sources.length} Verified Source Reference(s):</span>
                      </div>
                      ${eventData.sources.map((s, idx) => `
                        <div style="padding: 8px 10px; background: #181a24; border: 1px solid #282b38; border-radius: 8px; margin-bottom: 4px; color: #cbd5e1;">
                          <span style="color: #818cf8; font-weight: 700;">[${idx+1}]</span> <b>${s.source}</b> (Page ${s.page}) &bull; Sim: ${s.similarity}<br>
                          <i style="color: #94a3b8; font-size: 11.5px;">"${escapeHtml(s.snippet || '')}"</i>
                        </div>
                      `).join('')}
                    </div>
                  `;
                  lucide.createIcons();
                }
              } catch (err) {}
            }
          }
        }
      } catch (e) {
        if (e.name !== 'AbortError') console.error('Stream error:', e);
      } finally {
        isStreaming = false;
        document.getElementById('stopBtn').style.display = 'none';
        document.getElementById('sendBtn').style.display = 'flex';
        document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
        await loadConversations();
      }
    }

    function stopGenerating() {
      if (abortController) abortController.abort();
    }

    function setPromptAndSend(text) {
      document.getElementById('promptInput').value = text;
      sendMessage();
    }

    function regenerateLastResponse() {
      if (lastUserPrompt) setPromptAndSend(lastUserPrompt);
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text.replace(/[*#`_]/g, ''));
        utterance.rate = 1.05;
        window.speechSynthesis.speak(utterance);
      }
    }

    function copyToClipboard(btn, text) {
      navigator.clipboard.writeText(text);
      if (btn) {
        const oldHtml = btn.innerHTML;
        btn.innerHTML = '<i data-lucide="check" style="width:13px;height:13px;color:#34d399;"></i><span style="color:#34d399;">Copied!</span>';
        lucide.createIcons();
        setTimeout(() => { btn.innerHTML = oldHtml; lucide.createIcons(); }, 2000);
      }
    }

    async function handleFileUpload(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      const formData = new FormData();
      for (let i = 0; i < files.length; i++) {
        formData.append('files', files[i]);
      }

      document.getElementById('docCountBadge').innerText = 'Indexing...';

      try {
        const res = await fetch(`${getApiBase()}/api/documents/upload`, { method: 'POST', headers: getAuthHeaders(), body: formData });
        if (res.ok) await loadDocuments();
      } catch (e) { console.error('Upload failed', e); }
    }

    async function loadDocuments() {
      try {
        const res = await fetch(`${getApiBase()}/api/documents`, { headers: getAuthHeaders() });
        if (res.ok) {
          const docs = await res.json();
          document.getElementById('docCountBadge').innerText = `${docs.length} file(s)`;
          const listDiv = document.getElementById('uploadedDocsList');
          if (docs.length === 0) {
            listDiv.innerHTML = '<span style="color: #64748b; font-style: italic;">No files uploaded yet</span>';
          } else {
            listDiv.innerHTML = docs.map(d => `
              <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; background: #181a24; border-radius: 6px; margin-bottom: 3px; border: 1px solid #282b38;">
                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #cbd5e1;">📄 ${escapeHtml(d.filename)}</span>
                <button onclick="deleteDoc('${d.id}')" class="btn-icon" style="padding: 2px;"><i data-lucide="x" style="width: 12px; height: 12px;"></i></button>
              </div>
            `).join('');
            lucide.createIcons();
          }
        }
      } catch (e) {}
    }

    async function deleteDoc(docId) {
      await fetch(`${getApiBase()}/api/documents/${docId}`, { method: 'DELETE', headers: getAuthHeaders() });
      await loadDocuments();
    }

    function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
    function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }
    async function saveSettings() {
      const sysPrompt = document.getElementById('systemPromptInput').value.trim();
      await fetch(`${getApiBase()}/api/auth/settings`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
        body: JSON.stringify({ system_prompt: sysPrompt })
      });
      closeSettingsModal();
    }

    function toggleModelDropdown() { document.getElementById('modelDropdown').classList.toggle('hidden'); }
    function selectModel(modelId, provider, label) {
      currentModel = modelId;
      currentProvider = provider;
      document.getElementById('selectedModelLabel').innerText = label;
      document.getElementById('modelDropdown').classList.add('hidden');
    }

    function toggleSidebar(forceState) {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebarBackdrop');
      if (typeof forceState === 'boolean') {
        sidebar.classList.toggle('open', forceState);
        backdrop.style.display = forceState ? 'block' : 'none';
      } else {
        sidebar.classList.toggle('open');
        backdrop.style.display = sidebar.classList.contains('open') ? 'block' : 'none';
      }
    }

    function autoResizeTextarea(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
    function handleInputKeyDown(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
    function scrollToBottom() { const c = document.getElementById('chatMessages'); c.scrollTop = c.scrollHeight; }
    function escapeHtml(str) { return str ? str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }
    function escapeJs(str) { return str ? str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n') : ''; }
    async function deleteChat(id) {
      await fetch(`${getApiBase()}/api/conversations/${id}`, { method: 'DELETE', headers: getAuthHeaders() });
      await loadConversations();
      if (activeConversationId === id) {
        if (conversations.length > 0) selectConversation(conversations[0].id);
        else await createNewChat();
      }
    }
  </script>
</body>
</html>
